name: POS API and SQL integration
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: POS_CI_Only_2026!Strong
        ports: ['1433:1433']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build separate API and admin app
        run: |
          dotnet build VoucherSystemApp.API/VoucherSystemApp.API.csproj -c Release
          dotnet build TicketVoucherSystemApp/TicketVoucherSystemApp.csproj -c Release
      - name: Deploy disposable database and test repeatable upgrade
        shell: bash
        run: |
          container="${{ job.services.sqlserver.id }}"
          for attempt in {1..30}; do
            if docker exec "$container" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'POS_CI_Only_2026!Strong' -C -b -Q 'SELECT 1' >/dev/null 2>&1; then break; fi
            if [ "$attempt" = 30 ]; then exit 1; fi
            sleep 2
          done
          docker exec "$container" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'POS_CI_Only_2026!Strong' -C -b -Q 'CREATE DATABASE VoucherPosTest'
          docker cp TicketVoucherSystem.Database/. "$container":/tmp/database
          docker exec -w /tmp/database/Scripts "$container" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'POS_CI_Only_2026!Strong' -C -b -d VoucherPosTest -i Deploy.sql
          docker exec -w /tmp/database/Scripts "$container" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'POS_CI_Only_2026!Strong' -C -b -d VoucherPosTest -i Upgrade-POS-API.sql
      - name: Test HTTP contract and SQL concurrency
        env:
          POS_TEST_SQL: Server=localhost,1433;Database=VoucherPosTest;User Id=sa;Password=POS_CI_Only_2026!Strong;Encrypt=true;TrustServerCertificate=true
        run: dotnet test VoucherSystemApp.API.Tests/VoucherSystemApp.API.Tests.csproj -c Release --logger "trx;LogFileName=pos-api.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: POS-API-test-results
          path: VoucherSystemApp.API.Tests/TestResults
